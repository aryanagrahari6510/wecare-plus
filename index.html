<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeCare+ Hospital Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark teal sidebar + working canvas; split login with the module map on the left */
:root{
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#edf3f3;--surface:#ffffff;--surface2:#f4f9f9;--ink:#0f2740;--muted:#53687a;--line:#d5e1e3;
  --brand:#0a6a72;--brand-hi:#07555b;--on-brand:#ffffff;--brand-soft:#d9eeee;--accent:#e0693f;
  --side:#0e3340;--side-ink:#cfe3e7;--side-on:#17505e;--side-line:#1c4553;
  --ok:#16704a;--ok-bg:#ddf2e7;--warn:#85540a;--warn-bg:#fcedcc;--bad:#a3261e;--bad-bg:#fadfdc;--info:#1d559e;--info-bg:#dfeafa;
  --shadow:0 1px 2px rgba(15,39,64,.06),0 8px 24px rgba(15,39,64,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1821;--surface:#112530;--surface2:#0e202a;--ink:#e4eef2;--muted:#94aab7;--line:#24414e;
  --brand:#3bbfc2;--brand-hi:#5fd0d3;--on-brand:#052a2e;--brand-soft:#123b42;--accent:#f08a62;
  --side:#08202a;--side-ink:#b9d2d9;--side-on:#123a46;--side-line:#16323d;
  --ok:#63d39b;--ok-bg:#12372a;--warn:#f0bb5e;--warn-bg:#3a2d10;--bad:#ff938a;--bad-bg:#401a17;--info:#8bb8f2;--info-bg:#152f4f;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1821;--surface:#112530;--surface2:#0e202a;--ink:#e4eef2;--muted:#94aab7;--line:#24414e;
  --brand:#3bbfc2;--brand-hi:#5fd0d3;--on-brand:#052a2e;--brand-soft:#123b42;--accent:#f08a62;
  --side:#08202a;--side-ink:#b9d2d9;--side-on:#123a46;--side-line:#16323d;
  --ok:#63d39b;--ok-bg:#12372a;--warn:#f0bb5e;--warn-bg:#3a2d10;--bad:#ff938a;--bad-bg:#401a17;--info:#8bb8f2;--info-bg:#152f4f;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.01em}
.muted,.sub,small{color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* login */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.hero{background:var(--side);color:var(--side-ink);padding:clamp(24px,5vw,64px) clamp(16px,4vw,56px)}
.hero-in{max-width:560px;display:flex;flex-direction:column;gap:18px}
.wm{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-size:22px}
.wm b{color:var(--accent);font-weight:700}
.wm.big{font-size:clamp(44px,7vw,72px);line-height:1;color:#fff}
.lead{font-size:18px;line-height:1.45;color:#fff;max-width:34ch}
.eyebrow{font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-ink);opacity:.8;margin-top:10px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0}
.flow li{font-size:13px;color:#fff}
.flow li+li::before{content:"\2192";margin:0 8px;color:var(--accent)}
.mods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.mods li{border:1px solid var(--side-line);background:var(--side-on);border-radius:8px;padding:8px 10px;font-size:13px;color:#fff}
.fine{font-size:12.5px;opacity:.75;margin-top:6px}
.authpane{display:grid;place-items:center;padding:clamp(24px,5vw,56px) 16px}
.authbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.demo{display:flex;flex-wrap:wrap;gap:6px}
.flash{background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:8px;font-weight:500}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:8px;font-weight:500}

/* forms */
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-weight:600;font-size:13px}
input,select,textarea{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[type=checkbox],input[type=radio]{width:auto}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:500}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
label.slot{position:relative;display:block}
.slot input{position:absolute;opacity:0;inset:0}
.slot span{display:block;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);font-variant-numeric:tabular-nums}
.slot input:checked+span{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.slot input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.slot.off span{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hint{color:var(--muted)}.hint.bad{color:var(--bad)}
.docinfo{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:13px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.side .wm{color:#fff;font-size:24px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand .role{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.navb{text-align:left;border:0;background:transparent;color:var(--side-ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.navb:hover{background:var(--side-line)}
.navb.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who div{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.top-act{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--brand)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.content{padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:20px;max-width:1180px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .sub{margin-top:4px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

/* content blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.appt{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.appt .when{display:flex;flex-direction:column;min-width:96px}
.appt .det{display:flex;flex-direction:column;flex:1;min-width:150px}
.appt .det span{color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rem:last-child{border-bottom:0}
.rem .t{min-width:68px}
.rem .rm{display:flex;flex-direction:column;flex:1;min-width:140px}
.rem .rm span{color:var(--muted);font-size:13px}
.rem.done .rm strong{color:var(--muted)}
.late{color:var(--bad)}
.note{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.note:last-child{border-bottom:0}
.note.unread{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.note time{color:var(--muted);font-size:12px}
.tl{border-left:2px solid var(--line);margin:0 0 0 6px;padding:0 0 0 20px;display:flex;flex-direction:column;gap:18px}
.tl-i{position:relative;display:flex;flex-direction:column;gap:6px}
.tl-i::before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.tl-i.lab::before{border-color:var(--accent)}
.tl-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.bar{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--brand)}
.bar .track{background:var(--surface2);border-radius:5px;overflow:hidden}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.pick{display:flex;flex-direction:column;gap:8px}
.pickb{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pickb.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.chat{display:flex;flex-direction:column;gap:12px}
.chat-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.msgs{display:flex;flex-direction:column;gap:8px;height:300px;overflow-y:auto;padding:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg small{display:block;opacity:.75;font-size:11.5px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand)}
.msg.me small{color:inherit}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.video{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt{aspect-ratio:16/10;background:var(--side);color:#fff;border-radius:10px;display:grid;place-items:center;text-align:center;padding:8px;font-size:13px}
.vt b{display:block;font-family:var(--f-display);font-size:26px}
.compose{display:flex;gap:8px}
.rxrow{display:grid;grid-template-columns:2fr 1.2fr 1.6fr .8fr 2fr auto;gap:8px;align-items:end}
.rxcard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rxcard>header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.inv{display:flex;flex-direction:column;gap:14px}
.inv-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:6px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(6,18,26,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:600px;width:100%;max-height:calc(100% - 24px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--brand)}
.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.info{border-left-color:var(--accent)}

@media (max-width:900px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 12px 8px;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .navb{white-space:nowrap;flex:none}
  .navb.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .cols,.split{grid-template-columns:minmax(0,1fr)}
  .row3{grid-template-columns:minmax(0,1fr)}
  .rxrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rxrow .fld:first-child{grid-column:1/-1}
}
@media (max-width:520px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:90px 1fr 48px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>

</head><body>
<div id="app"></div>
<div id="modal" class="scrim" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dow=s=>new Date(s+'T00:00:00').getDay();
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const longDate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const toMin=t=>{const p=t.split(':');return (+p[0])*60+(+p[1])};
const fmtTime=t=>{const p=t.split(':');let h=+p[0];const am=h<12;h=h%12||12;return h+':'+p[1]+' '+(am?'am':'pm')};
const fmtStamp=ms=>new Date(ms).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const initials=n=>String(n).replace(/^Dr\.?\s+/i,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const fd=f=>{const o={};new FormData(f).forEach((v,k)=>{o[k]=v});return o};
const ROLE={patient:'Patient',doctor:'Doctor',receptionist:'Receptionist',pharmacist:'Pharmacist',lab:'Laboratory staff',admin:'Administrator'};
const PFX={patient:'P',doctor:'D',receptionist:'R',pharmacist:'PH',lab:'L',admin:'A'};
const BASE={patient:1000,doctor:2000,receptionist:3000,pharmacist:4000,lab:5000,admin:9000};
const FREQ={'Once daily (morning)':['09:00'],'Once daily (night)':['21:00'],'Twice daily':['09:00','21:00'],'Thrice daily':['08:00','14:00','21:00']};
const KIND={Booked:'info',Confirmed:'ok',Completed:'mute',Cancelled:'bad',Unpaid:'warn',Paid:'ok',Requested:'info','Sample Collected':'warn',Pending:'info',Taken:'ok',Skipped:'bad',Snoozed:'warn',Normal:'ok',Abnormal:'bad'};
const chip=(t,k)=>'<span class="chip '+(k||KIND[t]||'mute')+'">'+esc(t)+'</span>';
const empty=(m,extra)=>'<div class="empty"><span>'+m+'</span>'+(extra||'')+'</div>';
const stat=(n,l)=>'<div class="stat"><span class="n">'+n+'</span><span class="l">'+l+'</span></div>';
const fld=(id,label,inner,hint)=>'<div class="fld"><label for="'+id+'">'+label+'</label>'+inner+(hint?'<small>'+hint+'</small>':'')+'</div>';
const inp=(id,type,val,extra)=>'<input id="'+id+'" name="'+id.replace(/^[a-z]+-/,'')+'" type="'+type+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'>';
const sel=(id,opts,val,extra)=>'<select id="'+id+'" name="'+id.replace(/^[a-z]+-/,'')+'" '+(extra||'')+'>'+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'" '+(String(v)===String(val)?'selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select>';

async function hash(p){
  const s='wecare:'+p;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'x'+h.toString(16);
}

function genReminders(rx,historical){
  const out=[],td=today(),now=nowHM();
  rx.items.forEach(it=>{
    const times=FREQ[it.freq]||['09:00'];
    const n=Math.min(Math.max(+it.days||1,1),30);
    for(let d=0;d<n;d++){
      const date=addDays(rx.date,d);
      times.forEach((tm,ti)=>{
        let status='Pending';
        if(historical&&date<td)status=((d+ti)%9===4)?'Skipped':'Taken';
        else if(!historical&&date===td&&tm<=now)return;
        out.push({id:'RM-'+nid('rem'),rxId:rx.id,pid:rx.pid,med:it.name,dose:it.dose,date:date,time:tm,status:status});
      });
    }
  });
  return out;
}

function genSlots(from,to){const o=[];let m=toMin(from);const e=toMin(to);while(m<e){o.push(pad(Math.floor(m/60))+':'+pad(m%60));m+=30}return o}
function slotsHTML(did,date,sel,ignore){
  const d=U(did);
  if(!d||!date)return '<p class="hint">Choose a doctor and a date to see free slots.</p>';
  if(date<today())return '<p class="hint bad">Pick today or a later date.</p>';
  if(d.days.indexOf(dow(date))<0)return '<p class="hint bad">'+esc(d.name)+' does not see patients on '+DN[dow(date)]+'. Available on: '+d.days.map(x=>DN[x]).join(', ')+'.</p>';
  const taken={};S.appts.forEach(a=>{if(a.did===did&&a.date===date&&a.status!=='Cancelled'&&a.id!==ignore)taken[a.slot]=1});
  const now=nowHM();
  return '<div class="slots">'+genSlots(d.from,d.to).map(s=>{
    const off=taken[s]||(date===today()&&s<=now);
    return '<label class="slot'+(off?' off':'')+'"><input type="radio" name="slot" value="'+s+'"'+(off?' disabled':'')+(s===sel?' checked':'')+'><span>'+fmtTime(s)+'</span></label>';
  }).join('')+'</div>';
}

  const d=U(did);if(!d)return '';
  return '<div class="docinfo"><strong>'+esc(d.name)+'</strong> · '+esc(d.dept)+' · '+esc(d.qual)+'<br>Fee '+inr(d.fee)+' · '+d.days.map(x=>DN[x]).join(', ')+' · '+fmtTime(d.from)+' to '+fmtTime(d.to)+'</div>';
}
function checkSlot(p,ignore){
  const d=U(p.did);
  if(!U(p.pid))return 'Select a patient.';
  if(!d)return 'Select a doctor.';
  if(!p.date)return 'Select a date.';
  if(p.date<today())return 'The date cannot be in the past.';
  if(d.days.indexOf(dow(p.date))<0)return d.name+' is not available on '+DN[dow(p.date)]+'.';
  if(!p.slot)return 'Select a time slot.';
  if(p.date===today()&&p.slot<=nowHM())return 'That time has already passed. Pick a later slot.';
  if(S.appts.some(a=>a.id!==ignore&&a.did===p.did&&a.date===p.date&&a.slot===p.slot&&a.status!=='Cancelled'))return 'That slot was just taken. Pick another.';
  if(S.appts.some(a=>a.id!==ignore&&a.pid===p.pid&&a.date===p.date&&a.slot===p.slot&&a.status!=='Cancelled'))return 'The patient already has an appointment at that time.';
  return '';
}

  openModal(mh('Upload report '+l.id)+'<form class="form" data-form="labresult"><input type="hidden" name="id" value="'+l.id+'"><p>'+esc(l.test)+' for <strong>'+esc(U(l.pid).name)+'</strong></p>'+fld('lr-flag','Overall result',sel('lr-flag',['Normal','Abnormal'],'Normal'))+fld('lr-result','Findings','<textarea id="lr-result" name="result" placeholder="Enter the values and remarks"></textarea>')+'<p class="err" id="lrErr" role="alert" hidden></p><div class="btns"><button class="btn primary" type="submit">Publish report</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>');
};
A.dispense=el=>{
  const r=S.rx.find(x=>x.id===el.dataset.id),lines=[],short=[];
  r.items.forEach(it=>{
    const m=findMed(it.name),q=qtyFor(it);
    if(!m)return;
    if(m.stock<q)short.push(m.name+' (need '+q+', have '+m.stock+')');
    else lines.push({m:m,q:q});
  });
  if(!lines.length&&!short.length){toast('None of these medicines are in the catalogue.','bad');return}
  if(short.length){toast('Not enough stock: '+short.join('; ')+'. Restock first.','bad');return}
  lines.forEach(l=>{l.m.stock-=l.q});
  addBill(r.pid,'Pharmacy',lines.map(l=>({desc:l.m.name+' x '+l.q,amt:l.q*l.m.price})));
  r.dispensed=true;r.dispensedOn=today();
  notify(r.pid,'Your medicines for '+r.id+' are ready at the pharmacy.');
  commit();toast('Dispensed '+r.id+'. Stock updated and invoice generated.');render();
};

/* ---------- forms (submits) ---------- */
const F={};
function startSession(u){
  session={uid:u.id};view='dash';ui.chatAppt=null;ui.video=false;ui.flash='';ui.prefill='';
  render();window.scrollTo(0,0);toast('Welcome, '+u.name.split(' ')[0]+'.');tick();
}
F.login=async f=>{
  const d=fd(f),key=(d.id||'').trim().toLowerCase();
  if(!key||!d.pw)return showErr('liErr','Enter your email or User ID and your password.');
  const u=S.users.find(x=>x.email.toLowerCase()===key||x.id.toLowerCase()===key);
  const ok=u&&u.pw===await hash(d.pw);
  if(!ok)return showErr('liErr','Incorrect email, User ID or password. Access denied.');
  if(!u.active)return showErr('liErr','This account is deactivated. Contact the hospital administrator.');
  startSession(u);
};
F.signup=async f=>{
  const d=fd(f),err=m=>showErr('suErr',m);
  const name=(d.name||'').trim(),email=(d.email||'').trim().toLowerCase(),phone=(d.phone||'').trim(),role=d.role;
  if(name.length<3)return err('Enter your full name.');
  if(!/^\d{10}$/.test(phone))return err('Enter a 10-digit contact number.');
  if(!isEmail(email))return err('Enter a valid email address.');
  if((d.pw||'').length<6)return err('Password needs at least 6 characters.');
  if(d.pw!==d.pw2)return err('The two passwords do not match.');
  if(S.users.some(u=>u.email.toLowerCase()===email))return err('An account with this email already exists. Sign in instead.');
  const u={id:newUserId(role),role:role,name:role==='doctor'&&!/^dr\.?\s/i.test(name)?'Dr. '+name:name,email:email,phone:phone,active:true,pw:await hash(d.pw)};
  if(role==='patient'){u.age=+d.age||null;u.gender=d.gender||'';u.blood=d.blood||'';u.allergies='';u.emergency=''}
  if(role==='doctor'){
    if(!(d.qual||'').trim())return err('Enter your qualification.');
    if(!(+d.fee>=0)||d.fee==='')return err('Enter a valid consultation fee.');
    u.dept=d.dept;u.qual=d.qual.trim();u.fee=+d.fee;u.days=[1,2,3,4,5];u.from='10:00';u.to='13:00';
  }
  S.users.push(u);notifyRole('admin','New '+ROLE[role].toLowerCase()+' account: '+u.name+' ('+u.id+').');commit();
  ui.authTab='in';ui.prefill=u.email;ui.flash='Account created. Your User ID is <b>'+u.id+'</b>. Sign in to continue.';render();
};
F.book=f=>{
  const d=fd(f),u=me(),pid=d.pid||u.id;
  const msg=checkSlot({pid:pid,did:d.did,date:d.date,slot:d.slot});
  if(msg)return showErr('bkErr',msg);
  if(!(d.reason||'').trim())return showErr('bkErr','Add a short reason for the visit.');
  const a={id:'AP-'+nid('appt'),pid:pid,did:d.did,date:d.date,slot:d.slot,reason:d.reason.trim(),status:'Booked',chat:[]};
  S.appts.push(a);const doc=U(a.did),pt=U(pid);
  notify(pid,'Appointment '+a.id+' booked with '+doc.name+' on '+fmtDate(a.date)+' at '+fmtTime(a.slot)+'.');
  notify(a.did,'New appointment '+a.id+' from '+pt.name+' on '+fmtDate(a.date)+' at '+fmtTime(a.slot)+'.');
  commit();
  openModal(mh('Appointment booked')+'<dl class="kv"><dt>Appointment</dt><dd class="mono">'+a.id+'</dd><dt>Patient</dt><dd>'+esc(pt.name)+'</dd><dt>Doctor</dt><dd>'+esc(doc.name)+' · '+esc(doc.dept)+'</dd><dt>When</dt><dd>'+fmtDate(a.date)+' at '+fmtTime(a.slot)+'</dd><dt>Fee</dt><dd>'+inr(doc.fee)+' (billed after the consultation)</dd></dl><p class="hint">A confirmation was sent to the patient and the doctor.</p><div class="btns"><button class="btn primary" data-act="nav" data-view="appts">View appointments</button><button class="btn" data-act="close">Close</button></div>');
  render();
};
F.resched=f=>{
  const d=fd(f),a=S.appts.find(x=>x.id===d.id);
  const msg=checkSlot({pid:a.pid,did:a.did,date:d.date,slot:d.slot},a.id);
  if(msg)return showErr('rsErr',msg);
  a.date=d.date;a.slot=d.slot;a.status='Booked';
  notify(a.pid,'Appointment '+a.id+' moved to '+fmtDate(a.date)+' at '+fmtTime(a.slot)+'.');notify(a.did,'Appointment '+a.id+' with '+U(a.pid).name+' moved to '+fmtDate(a.date)+' at '+fmtTime(a.slot)+'.');

};
F.chat=f=>{
  const d=fd(f),text=(d.text||'').trim();if(!text)return;
  const a=S.appts.find(x=>x.id===ui.chatAppt);if(!a||!consultAllowed(a))return;
  a.chat.push({from:session.uid,text:text,t:Date.now()});
  const other=session.uid===a.pid?a.did:a.pid;
  notify(other,'New message from '+me().name+' in consultation '+a.id+'.');
  commit();render();const i=$('#ch-text');if(i)i.focus();
};
F.endcons=f=>{
  const d=fd(f),a=S.appts.find(x=>x.id===d.id),doc=me();
  if(!(d.diag||'').trim())return showErr('ecErr','Enter a diagnosis so it can be saved in the medical history.');
  a.status='Completed';a.diagnosis=d.diag.trim();a.notes=(d.notes||'').trim();
  addBill(a.pid,'Consultation',[{desc:'Consultation, '+doc.name+' ('+a.id+')',amt:doc.fee}]);
  notify(a.pid,'Your consultation '+a.id+' is complete. Diagnosis and advice are saved in your medical history.');
  commit();
  openModal(mh('Consultation completed')+'<p>The record was saved and the consultation invoice was generated. Write the prescription now?</p><div class="btns"><button class="btn primary" data-act="rxfor" data-id="'+a.id+'">Write prescription</button><button class="btn" data-act="close">Later</button></div>');
  render();
};
F.rx=f=>{
  const d=fd(f),err=m=>showErr('rxErr',m);
  const a=S.appts.find(x=>x.id===d.appt);
  if(!a)return err('Select the appointment this prescription is for.');
  if(!(d.diag||'').trim())return err('Enter the diagnosis.');
  const items=[];
  const rows=f.querySelectorAll('.rxrow');
  for(let i=0;i<rows.length;i++){
    const g=n=>rows[i].querySelector('[name='+n+']').value.trim();
    const name=g('m_name'),days=+g('m_days');
    if(!name&&rows.length>1)continue;
    if(!name)return err('Enter at least one medicine.');
    if(!(days>=1&&days<=30))return err('Days must be between 1 and 30 for '+name+'.');
    if(!g('m_dose'))return err('Enter the dose for '+name+'.');
    items.push({name:name,dose:g('m_dose'),freq:g('m_freq'),days:days,instr:g('m_instr')});
  }
  if(!items.length)return err('Enter at least one medicine.');
  const rx={id:'RX-'+nid('rx'),apptId:a.id,pid:a.pid,did:a.did,date:today(),diagnosis:d.diag.trim(),items:items,dispensed:false};
  S.rx.push(rx);a.diagnosis=a.diagnosis||rx.diagnosis;
  const rem=genReminders(rx,false);rem.forEach(r=>S.rem.push(r));
  const pt=U(a.pid);
  notify(a.pid,'New prescription '+rx.id+' from '+me().name+'. '+rem.length+' medicine reminders were scheduled.');
  notifyRole('pharmacist','Prescription '+rx.id+' for '+pt.name+' is waiting to be dispensed.');
  const allergy=pt.allergies&&pt.allergies!=='None'?' Note: patient allergy on file: '+pt.allergies+'.':'';
  commit();ui.rxAppt=null;go('dash');toast('Prescription '+rx.id+' issued.'+allergy);
};
F.labreq=f=>{
  const d=fd(f),err=m=>showErr('lqErr',m);
  if(!d.pid)return err('Select a patient.');
  const t=S.tests.find(x=>x.name===d.test);if(!t)return err('Select a test.');
  const l={id:'LB-'+nid('lab'),pid:d.pid,did:session.uid,test:t.name,price:t.price,note:(d.note||'').trim(),status:'Requested',date:today(),result:'',flag:''};
  S.labs.push(l);notifyRole('lab','New request '+l.id+': '+t.name+' for '+U(d.pid).name+'.');notify(d.pid,'Dr. '+me().name.replace(/^Dr\.?\s+/i,'')+' ordered a lab test: '+t.name+'.');
  commit();closeModal();toast('Test '+l.id+' sent to the laboratory.');render();
};
F.labresult=f=>{
  const d=fd(f),l=S.labs.find(x=>x.id===d.id);
  if(!(d.result||'').trim())return showErr('lrErr','Enter the findings before publishing.');
  l.status='Completed';l.result=d.result.trim();l.flag=d.flag;l.completedOn=today();

F.pay=f=>{

F.profile=f=>{
  const d=fd(f),u=me(),err=m=>showErr('pfErr',m);
  if((d.name||'').trim().length<3)return err('Enter your full name.');
  if(!/^\d{10}$/.test((d.phone||'').trim()))return err('Enter a 10-digit contact number.');
  if(u.role==='doctor'){
    const days=Array.from(f.querySelectorAll('input[name=days]:checked')).map(x=>+x.value);
    if(!days.length)return err('Choose at least one available day.');
    if(!d.from||!d.to||toMin(d.from)>=toMin(d.to))return err('The end time must be after the start time.');
    if(!(+d.fee>=0)||d.fee==='')return err('Enter a valid fee.');
    u.dept=d.dept;u.fee=+d.fee;u.qual=(d.qual||'').trim();u.days=days;u.from=d.from;u.to=d.to;
  }
  if(u.role==='patient'){u.age=+d.age||null;u.gender=d.gender;u.blood=d.blood;u.allergies=(d.allergies||'').trim();u.emergency=(d.emergency||'').trim()}
  u.name=d.name.trim();u.phone=d.phone.trim();commit();toast('Profile saved.');render();
};
F.password=async f=>{
  const d=fd(f),u=me(),err=m=>showErr('pwErr',m);
  if(u.pw!==await hash(d.old||''))return err('The current password is incorrect.');
  if((d.new||'').length<6)return err('New password needs at least 6 characters.');
  u.pw=await hash(d.new);commit();f.reset();toast('Password updated.');
};
F.register=async f=>{
  const d=fd(f),err=m=>showErr('rgErr',m);
  const name=(d.name||'').trim(),email=(d.email||'').trim().toLowerCase();
  if(name.length<3)return err('Enter the patient’s full name.');
  if(!/^\d{10}$/.test((d.phone||'').trim()))return err('Enter a 10-digit contact number.');
  if(!isEmail(email))return err('Enter a valid email address.');
  if((d.pw||'').length<6)return err('Temporary password needs at least 6 characters.');
  if(S.users.some(u=>u.email.toLowerCase()===email))return err('A user with this email already exists.');
  const u={id:newUserId('patient'),role:'patient',name:name,email:email,phone:d.phone.trim(),age:+d.age||null,gender:d.gender,blood:d.blood,allergies:'',emergency:'',active:true,pw:await hash(d.pw)};
  S.users.push(u);commit();
  openModal(mh('Patient registered')+'<dl class="kv"><dt>Name</dt><dd>'+esc(u.name)+'</dd><dt>User ID</dt><dd class="mono">'+u.id+'</dd><dt>Login</dt><dd>'+esc(u.email)+'</dd></dl><div class="btns"><button class="btn primary" data-act="nav" data-view="book">Schedule appointment</button><button class="btn" data-act="close">Close</button></div>');
  f.reset();
};
F.medadd=f=>{
  const d=fd(f),err=m=>showErr('mdErr',m),name=(d.name||'').trim();
  if(!name)return err('Enter the medicine name.');
  if(!(+d.qty>=1))return err('Enter a quantity of at least 1.');
  let m=S.meds.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!m){
    if(!(d.price!==''&&+d.price>=0))return err('A new medicine needs a price.');
    if(!d.expiry)return err('A new medicine needs an expiry date.');
    m={name:name,price:+d.price,stock:0,expiry:d.expiry};S.meds.push(m);
  }
  m.stock+=Math.floor(+d.qty);if(d.price!=='')m.price=+d.price;if(d.expiry)m.expiry=d.expiry;
  commit();toast(m.name+' now has '+m.stock+' in stock.');render();
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const fn=F[f.dataset.form];if(!fn)return;
  const er=f.querySelector('.err');if(er)er.hidden=true;
  try{const r=fn(f);if(r&&r.catch)r.catch(x=>toast('Something went wrong: '+x.message,'bad'))}catch(x){toast('Something went wrong: '+x.message,'bad')}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-on]');if(!el)return;
  const fn=C[el.dataset.on];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{S=JSON.parse(e.newValue)}catch(x){return}
  if(!session)return;
  if(!U(session.uid)){session=null;render();return}
  updateBell();
  if(view==='consult'&&$('#modal').hidden&&!(document.activeElement&&document.activeElement.id==='ch-text'&&document.activeElement.value))render();
});

/* ---------- medicine alerts ---------- */
function tick(){
  if(!session||!S)return;
  const u=me();if(!u||u.role!=='patient')return;
  const td=today(),nowM=toMin(nowHM());let fired=false;
  S.rem.forEach(r=>{
    if(r.pid!==u.id||r.date!==td||alerted[r.id])return;
    if(r.status!=='Pending'&&r.status!=='Snoozed')return;
    const diff=nowM-toMin(r.time);
    if(diff>=0&&diff<=90){
      alerted[r.id]=1;fired=true;
      toast('Time for '+r.med+' ('+r.dose+'). Open Home to mark it.','info');
      notify(u.id,'Medicine reminder: '+r.med+' ('+r.dose+') at '+fmtTime(r.time)+'.');
    }else if(diff>90)alerted[r.id]=1;
  });
  if(fired){save();updateBell();if(view==='dash'||view==='rem')render()}
}
setInterval(tick,20000);

/* ---------- boot ---------- */
async function boot(){
  const th=lsGet(THEME);if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
  const raw=lsGet(KEY);
  if(raw){try{S=JSON.parse(raw)}catch(e){S=null}}
  if(!S||!S.users||(S.touched===false&&S.seededOn!==today()))S=await seed();
  save();render();
}
boot();
})();
